#cloud-config
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
    variant: ''
  network:
    version: 2
    ethernets:
      enp0s25:
        dhcp4: true
  identity:
    hostname: nas
    username: homelab
    realname: Homelab Admin
    password: "REPLACE_WITH_SHA512_HASH"
  ssh:
    install-server: true
    authorized-keys:
      - "ssh-ed25519 AAAA...replace..."
    allow-pw: false
  updates: security
  storage:
    layout:
      name: direct
      match:
        path: /dev/disk/by-id/REPLACE_OS_DISK
    swap:
      size: 0
  packages:
    - zfsutils-linux
    - zfs-initramfs
    - python3
    - python3-pip
    - qemu-guest-agent
  late-commands:
    - curtin in-target --target=/target timedatectl set-timezone UTC
    - curtin in-target --target=/target systemctl enable ssh
    - curtin in-target --target=/target apt-get update
    - curtin in-target --target=/target apt-get install -y curl git
    # K3S Installation (includes Traefik as ingress controller)
    - curtin in-target --target=/target -- bash -c 'curl -sfL https://get.k3s.io | sh -'
    - curtin in-target --target=/target -- systemctl enable k3s

