#cloud-config
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
    variant: ''
  network:
    version: 2
    ethernets:
      enp0s25:
        dhcp4: true
  identity:
    hostname: nas
    username: homelab
    realname: Homelab Admin
    password: "REPLACE_WITH_SHA512_HASH"
  ssh:
    install-server: true
    authorized-keys:
      - "ssh-ed25519 AAAA...replace..."
    allow-pw: false
  updates: security
  storage:
    layout:
      name: direct
      match:
        path: /dev/disk/by-id/REPLACE_OS_DISK
    swap:
      size: 0
  packages:
    - zfsutils-linux
    - zfs-initramfs
    - python3
    - python3-pip
    - qemu-guest-agent
  late-commands:
    - curtin in-target --target=/target timedatectl set-timezone UTC
    - curtin in-target --target=/target systemctl enable ssh
    - curtin in-target --target=/target apt-get update
    - curtin in-target --target=/target apt-get install -y curl git
    # Docker Installation (Pinned to v27.x for Portainer compatibility)
    - curtin in-target --target=/target -- bash -c 'install -m 0755 -d /etc/apt/keyrings'
    - curtin in-target --target=/target -- bash -c 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc'
    - curtin in-target --target=/target -- bash -c 'chmod a+r /etc/apt/keyrings/docker.asc'
    - curtin in-target --target=/target -- bash -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null'
    - curtin in-target --target=/target apt-get update
    - curtin in-target --target=/target apt-get install -y docker-ce=5:27.5.1-1~ubuntu.24.04~noble docker-ce-cli=5:27.5.1-1~ubuntu.24.04~noble containerd.io docker-buildx-plugin docker-compose-plugin
