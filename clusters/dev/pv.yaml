apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-config-pv
  labels:
    type: local
spec:
  storageClassName: dev-hostpath
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/home/ubuntu/nas-volumes/qbittorrent"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-downloads-pv
  labels:
    type: local
spec:
  storageClassName: dev-hostpath
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/home/ubuntu/nas-volumes/nas/downloads"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-torrents-pv
  labels:
    type: local
spec:
  storageClassName: dev-hostpath
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/home/ubuntu/nas-volumes/nas/torrents"
