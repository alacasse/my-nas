apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Development environment overlay
# Uses local-path storage class (K3S default)

resources:
  - ../../apps/base
  - pv.yaml

patches:
  # Use manual PV binding for dev
  - target:
      kind: PersistentVolumeClaim
      name: qbittorrent-config
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: dev-hostpath
      - op: add
        path: /spec/volumeName
        value: qbittorrent-config-pv
  - target:
      kind: PersistentVolumeClaim
      name: nas-downloads
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: dev-hostpath
      - op: add
        path: /spec/volumeName
        value: nas-downloads-pv
