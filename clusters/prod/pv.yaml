apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-media-pv
  labels:
    type: local
spec:
  storageClassName: ""
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/storage/media"
