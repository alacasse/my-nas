apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production environment overlay
# Uses ZFS storage class via democratic-csi

resources:
  - ../../apps/base
  - ../../apps/qbittorrent/secrets.enc.yaml

patches:
  # Use ZFS storage class for prod
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: zfs-nfs
