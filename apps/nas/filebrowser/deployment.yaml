apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: nas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      initContainers:
      - name: init-config-perms
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          set -e
          mkdir -p /config
          # Only chown if needed; root-squashed volumes will reject chown even when already owned.
          if [ "$(stat -c %u /config)" != "1000" ]; then
            chown -R 1000:1000 /config || echo "WARN: unable to chown /config (root_squash?)"
          fi
          # Ensure top-level media dirs are writable by the app user.
          find /srv -maxdepth 1 -type d ! -user 1000 -exec chown 1000:1000 {} + 2>/tmp/chown.log || echo "WARN: unable to chown /srv (root_squash?)"
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: config
          mountPath: /config
        - name: filebrowser-media
          mountPath: /srv
      - name: init-filebrowser
        image: filebrowser/filebrowser:v2.30.0
        command:
        - sh
        - -c
        - |
          set -eu
          DB_PATH="/config/filebrowser.db"
          CONFIG_PATH="/config/settings.json"
          cat > "${CONFIG_PATH}" <<'EOF'
          {
            "port": 80,
            "baseURL": "",
            "address": "",
            "log": "stdout",
            "database": "/config/filebrowser.db",
            "root": "/srv"
          }
          EOF
          if [ ! -f "${DB_PATH}" ]; then
            /filebrowser config init -c "${CONFIG_PATH}" -d "${DB_PATH}" --root /srv --log stdout --address "" --port 80
            # Seed admin user only on first init to avoid DB lock races during restarts.
            # Credentials passed via temp file to avoid exposure in ps aux/kubectl describe
            printf '%s\n%s\n' "${FB_USERNAME}" "${FB_PASSWORD}" > /tmp/fb_creds.txt
            /filebrowser --database "${DB_PATH}" users add --perm.admin --scope "." < /tmp/fb_creds.txt
            rm -f /tmp/fb_creds.txt
          else
            echo "DB already exists; skipping user init to avoid lock contention."
          fi
        env:
        - name: FB_USERNAME
          valueFrom:
            secretKeyRef:
              name: filebrowser-credentials
              key: FB_USERNAME
        - name: FB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: filebrowser-credentials
              key: FB_PASSWORD
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: config
          mountPath: /config
        - name: filebrowser-media
          mountPath: /srv
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: filebrowser
        image: filebrowser/filebrowser:v2.30.0
        ports:
        - containerPort: 80
          name: http
        env:
        - name: FB_USERNAME
          valueFrom:
            secretKeyRef:
              name: filebrowser-credentials
              key: FB_USERNAME
        - name: FB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: filebrowser-credentials
              key: FB_PASSWORD
        - name: FB_DATABASE
          value: /config/filebrowser.db
        - name: FB_CONFIG
          value: /config/settings.json
        - name: FB_ROOT
          value: /srv
        volumeMounts:
        - name: config
          mountPath: /config
        - name: filebrowser-media
          mountPath: /srv
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: filebrowser-config
      - name: filebrowser-media
        persistentVolumeClaim:
          claimName: filebrowser-media
