apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: nas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      initContainers:
      - name: init-config-perms
        image: busybox:1.36
        command: ["/bin/sh", "/scripts/init-config-perms.sh"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: config
          mountPath: /config
        - name: filebrowser-media
          mountPath: /srv
        - name: scripts
          mountPath: /scripts
      - name: init-filebrowser
        image: filebrowser/filebrowser:v2.30.0
        command: ["/bin/sh", "/scripts/init-filebrowser.sh"]
        env:
        - name: FB_USERNAME
          valueFrom:
            secretKeyRef:
              name: filebrowser-credentials
              key: FB_USERNAME
        - name: FB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: filebrowser-credentials
              key: FB_PASSWORD
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: config
          mountPath: /config
        - name: filebrowser-media
          mountPath: /srv
        - name: scripts
          mountPath: /scripts
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: filebrowser
        image: filebrowser/filebrowser:v2.30.0
        ports:
        - containerPort: 80
          name: http
        env:
        - name: FB_USERNAME
          valueFrom:
            secretKeyRef:
              name: filebrowser-credentials
              key: FB_USERNAME
        - name: FB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: filebrowser-credentials
              key: FB_PASSWORD
        - name: FB_DATABASE
          value: /config/filebrowser.db
        - name: FB_CONFIG
          value: /config/settings.json
        - name: FB_ROOT
          value: /srv
        volumeMounts:
        - name: config
          mountPath: /config
        - name: filebrowser-media
          mountPath: /srv
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: filebrowser-config
      - name: filebrowser-media
        persistentVolumeClaim:
          claimName: filebrowser-media
      - name: scripts
        configMap:
          name: filebrowser-scripts
          defaultMode: 0755
