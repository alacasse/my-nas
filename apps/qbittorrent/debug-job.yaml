apiVersion: v1
kind: Pod
metadata:
  name: debug-nas-permissions
  namespace: torrents
spec:
  restartPolicy: Never
  containers:
  - name: debugger
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "Listing /config and /data..."
        echo "--- /config ---"
        ls -la /config || true
        echo "--- /data ---"
        ls -la /data || true
        echo "Creating qBittorrent directories..."
        mkdir -p /config/qBittorrent/config
        mkdir -p /config/logs
        mkdir -p /data/downloads
        mkdir -p /data/torrents
        echo "Verifying..."
        echo "--- /config ---"
        ls -la /config
        echo "--- /data ---"
        ls -la /data
    volumeMounts:
    - name: qbittorrent-config
      mountPath: /config
    - name: nas-downloads
      mountPath: /data
  volumes:
  - name: qbittorrent-config
    persistentVolumeClaim:
      claimName: qbittorrent-config
  - name: nas-downloads
    persistentVolumeClaim:
      claimName: nas-downloads
