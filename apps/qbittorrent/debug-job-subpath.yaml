apiVersion: v1
kind: Pod
metadata:
  name: debug-subpath
  namespace: torrents
spec:
  restartPolicy: Never
  containers:
  - name: debugger
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "Listing qbittorrent-config PVC..."
        ls -la /config
    volumeMounts:
    - name: qbittorrent-config
      mountPath: /config
  volumes:
  - name: qbittorrent-config
    persistentVolumeClaim:
      claimName: qbittorrent-config
