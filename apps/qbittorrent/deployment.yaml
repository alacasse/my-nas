apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: torrents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
      - name: qbittorrent
        image: binhex/arch-qbittorrentvpn
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
          privileged: true  # Required for VPN tunnel creation
        env:
        - name: VPN_ENABLED
          value: "yes"
        - name: VPN_PROV
          value: "custom"
        - name: VPN_CLIENT
          value: "openvpn"
        # VPN_USER and VPN_PASS are read from credentials.conf in the vpn-config directory
        - name: LAN_NETWORK
          value: "10.42.0.0/16,10.43.0.0/16"  # K3S pod and service networks
        - name: NAME_SERVERS
          value: "1.1.1.1,8.8.8.8"
        - name: WEBUI_PORT
          value: "8080"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Montreal"
        - name: DEBUG
          value: "false"
        ports:
        - containerPort: 8080
          name: webui
        - containerPort: 6881
          name: torrent-tcp
        - containerPort: 6881
          protocol: UDP
          name: torrent-udp
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /data/downloads
        - name: torrents
          mountPath: /data/torrents
        - name: vpn-config
          mountPath: /config/openvpn
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      # Init container copies default configs if they don't exist
      initContainers:
      - name: init-config
        image: busybox:1.36
        command: ["/bin/sh", "/defaults/init.sh"]
        volumeMounts:
        - name: config
          mountPath: /config
        - name: defaults
          mountPath: /defaults
      volumes:
      - name: defaults
        configMap:
          name: qbittorrent-defaults
          defaultMode: 0755
      - name: config
        persistentVolumeClaim:
          claimName: qbittorrent-config
      - name: downloads
        persistentVolumeClaim:
          claimName: nas-downloads
      - name: torrents
        persistentVolumeClaim:
          claimName: nas-torrents
      # vpn-config should ideally be a secret or configmap, but for now we might need to keep it
      # or better, assume the user handles it via secrets.
      # The previous plan said:
      # - name: VPN_USER valueFrom: secretKeyRef: name: vpn-credentials key: username
      # So we should rely on that and standard openvpn config if possible.
      # However, binhex/arch-qbittorrentvpn often needs custom .ovpn files.
      # Let's temporarily comment out vpn-config volume if it's not strictly needed for "custom" provider
      # OR mount it from a ConfigMap if we have the ovpn file.
      # For this step, I'll remove the hostPath vpn-config and assume we'll use a ConfigMap if needed.
      # But wait, lines 60-61 mount it at /config/openvpn.
      # Let's map it to a ConfigMap named 'vpn-config-files' which we will create if needed.
      - name: vpn-config
        secret:
          secretName: vpn-openvpn-config
          optional: true

