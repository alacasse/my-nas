apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: torrents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
      - name: qbittorrent
        image: binhex/arch-qbittorrentvpn
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
          privileged: true  # Required for VPN tunnel creation
        env:
        - name: VPN_ENABLED
          value: "yes"
        - name: VPN_PROV
          value: "custom"
        - name: VPN_CLIENT
          value: "openvpn"
        # VPN_USER and VPN_PASS are read from credentials.conf in the vpn-config directory
        - name: LAN_NETWORK
          value: "10.42.0.0/16,10.43.0.0/16"  # K3S pod and service networks
        - name: NAME_SERVERS
          value: "1.1.1.1,8.8.8.8"
        - name: WEBUI_PORT
          value: "8080"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Montreal"
        - name: DEBUG
          value: "false"
        - name: QBIT_MEDIA_ROOT
          value: "/data"
        ports:
        - containerPort: 8080
          name: webui
        - containerPort: 6881
          name: torrent-tcp
        - containerPort: 6881
          protocol: UDP
          name: torrent-udp
        volumeMounts:
        - name: qbittorrent-config
          mountPath: /config
        - name: nas-downloads
          mountPath: /data
        - name: vpn-config
          mountPath: /config/openvpn
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      # Init container copies default configs if they don't exist
      initContainers:
      - name: init-config
        image: busybox:1.36
        command: ["/bin/sh", "/scripts/init.sh"]
        env:
        - name: QBIT_MEDIA_ROOT
          value: "/data"
        volumeMounts:
        - name: qbittorrent-config
          mountPath: /config
        - name: defaults
          mountPath: /defaults
        - name: scripts
          mountPath: /scripts
        - name: nas-downloads
          mountPath: /data
      volumes:
      - name: defaults
        configMap:
          name: qbittorrent-defaults
          defaultMode: 0755
      - name: scripts
        configMap:
          name: qbittorrent-scripts
          defaultMode: 0755
      - name: qbittorrent-config
        persistentVolumeClaim:
          claimName: qbittorrent-config
      - name: nas-downloads
        persistentVolumeClaim:
          claimName: nas-downloads
      - name: vpn-config
        secret:
          secretName: vpn-credentials
          optional: true
