# PLACEHOLDER SECRETS - Replace with actual values before deploying!
# In production, these should be encrypted with SOPS
#
# To create real secrets:
#   kubectl create secret generic vpn-credentials \
#     --namespace=torrents \
#     --from-literal=username=YOUR_VPN_USER \
#     --from-literal=password=YOUR_VPN_PASS
#
#   kubectl create secret generic vpn-openvpn-config \
#     --namespace=torrents \
#     --from-file=path/to/your/vpn.ovpn
#
apiVersion: v1
kind: Secret
metadata:
  name: vpn-credentials
  namespace: torrents
type: Opaque
stringData:
  username: "REPLACE_WITH_VPN_USER"
  password: "REPLACE_WITH_VPN_PASS"
---
# VPN OpenVPN config file - should contain your .ovpn file content
# For now this is a placeholder that will cause VPN to fail
# You need to replace this with your actual NordVPN/other provider .ovpn content
apiVersion: v1
kind: Secret
metadata:
  name: vpn-openvpn-config
  namespace: torrents
type: Opaque
stringData:
  vpn.ovpn: |
    # PLACEHOLDER - Replace with your actual OpenVPN config
    # Download from your VPN provider (e.g., NordVPN)
    client
    dev tun
    proto udp
    # ... rest of your .ovpn config
