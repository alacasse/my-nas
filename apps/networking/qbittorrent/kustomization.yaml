apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: torrents

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - configmap.yaml
  - pvc.yaml
  # Secrets are applied separately via SOPS decryption in the Makefile
  # to avoid the "sops" field being rejected by Kubernetes

configMapGenerator:
  - name: qbittorrent-scripts
    options:
      disableNameSuffixHash: true
    files:
      - scripts/init.sh
