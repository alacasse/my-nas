# Portainer needs cluster-wide permissions to manage Kubernetes
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portainer
  namespace: management
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portainer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: portainer
  namespace: management
