apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: nas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      initContainers:
      - name: init-config-perms
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          set -e
          mkdir -p /config
          chown -R 1000:1000 /config
          # Ensure top-level media dirs are writable by the app user.
          find /srv -maxdepth 1 -type d -exec chown 1000:1000 {} +
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: config
          mountPath: /config
        - name: nas-media
          mountPath: /srv
      - name: init-filebrowser
        image: filebrowser/filebrowser:latest
        command:
        - sh
        - -c
        - |
          set -euo pipefail
          DB_PATH="/config/filebrowser.db"
          CONFIG_PATH="/config/settings.json"
          cat > "${CONFIG_PATH}" <<'EOF'
          {
            "port": 80,
            "baseURL": "",
            "address": "",
            "log": "stdout",
            "database": "/config/filebrowser.db",
            "root": "/srv"
          }
          EOF
          if [ ! -f "${DB_PATH}" ]; then
            filebrowser config init -c "${CONFIG_PATH}" -d "${DB_PATH}" --root /srv --log stdout --address "" --port 80
          fi
          # Ensure admin password matches the Kubernetes secret on every start.
          # Scope "." keeps the user rooted at the configured root (/srv).
          filebrowser --database "${DB_PATH}" users add "${FB_USERNAME}" "${FB_PASSWORD}" --perm.admin --scope "." 2>/tmp/fb-user.log || \
          filebrowser --database "${DB_PATH}" users update "${FB_USERNAME}" --password "${FB_PASSWORD}" --scope "." --perm.admin
        env:
        - name: FB_USERNAME
          valueFrom:
            secretKeyRef:
              name: filebrowser-credentials
              key: FB_USERNAME
        - name: FB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: filebrowser-credentials
              key: FB_PASSWORD
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: config
          mountPath: /config
        - name: nas-media
          mountPath: /srv
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: filebrowser
        image: filebrowser/filebrowser:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: FB_USERNAME
          valueFrom:
            secretKeyRef:
              name: filebrowser-credentials
              key: FB_USERNAME
        - name: FB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: filebrowser-credentials
              key: FB_PASSWORD
        - name: FB_DATABASE
          value: /config/filebrowser.db
        - name: FB_CONFIG
          value: /config/settings.json
        - name: FB_ROOT
          value: /srv
        volumeMounts:
        - name: config
          mountPath: /config
        - name: nas-media
          mountPath: /srv
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: filebrowser-config
      - name: nas-media
        persistentVolumeClaim:
          claimName: nas-media
