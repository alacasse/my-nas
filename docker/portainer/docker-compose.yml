services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"  # Portainer UI
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - lan_net

volumes:
  portainer_data:
    driver: local
    driver_opts:
      type: none
      device: ${STORAGE_BASE}/portainer_data
      o: bind

networks:
  lan_net:
    external: true
