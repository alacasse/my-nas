services:
  torrent:
    image: ghcr.io/linuxserver/qbittorrent
    container_name: torrent
    networks:
      - vpn_net
    # ports:
    # - "8080:8080"
    dns:
      - 192.168.50.124
    # - 1.1.1.1
    # - 8.8.8.8
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
    volumes:
      # - ./vpn-entrypoint.sh:/vpn-entrypoint.sh:ro
      - ./change-route.sh:/etc/cont-init.d/change-route.sh:ro
    restart: unless-stopped

networks:
  vpn_net:
    external: true
